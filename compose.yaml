services:
  web:
    build:
      context: .
      target: runtime
    ports:
      - "8080:80"
    restart: unless-stopped

  # Optional live-reload development mode; source is bind-mounted from the host.
  dev:
    profiles:
      - dev
    build:
      context: .
      target: dependencies
    command: ["sh", "-c", "npm ci --no-audit --no-fund && exec npm run dev"]
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"

volumes:
  node_modules:
